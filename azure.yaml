# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

# This is an example starter azure.yaml file containing several example services in comments below.
# Make changes as needed to describe your application setup.
# To learn more about the azure.yaml file, visit https://learn.microsoft.com/en-us/azure/developer/azure-developer-cli/azd-schema

# Name of the application.
metadata:
  template: hello-azd-dotnet
name: azd-starter
services:
  ## An example for a python API service.
  ## The service is named 'python-api'.
  ## The language is 'python'.
  ## The source code is located in the project (azure.yaml) directory.
  ## The service will be hosted on Azure App Service.
  # web:
  #   language: csharp
  #   project: ./src
  #   host: appservice
  aca:
    project: ./src
    language: csharp
    host: containerapp
    docker:
      path: ./Dockerfile
      remoteBuild: true
#   ## An example for a NodeJS API, located in src/api.
#   nodejs-api:
#     language: js
#     project: ./src/api
#     host: appservice
#   ## An example for a React front-end app.
#   ## The src/react-app/build folder is where the app is built to after `npm run build`.
#   react-web:
#     language: js
#     project: ./src/react-app
#     host: appservice
#     dist: build

hooks:
  postprovision:
    windows:
      shell: pwsh
      run: |
        dotnet user-secrets set "STORAGE_URL" "$Env:STORAGE_URL" --project ./src/HelloAZD.csproj
        dotnet user-secrets set "TABLES_URL" "$Env:TABLES_URL" --project ./src/HelloAZD.csproj
    posix:
      shell: sh
      run: |
        dotnet user-secrets set "STORAGE_URL" "$STORAGE_URL" --project ./src/HelloAZD.csproj
        dotnet user-secrets set "TABLES_URL" "$TABLES_URL" --project ./src/HelloAZD.csproj
  postdeploy:
    windows:
      shell: pwsh
      run: |
        $healthUrl = "$Env:AZURE_CONTAINER_APP_ENDPOINT/healthz"
        Write-Host "Waiting for the application to become ready..."
        for ($attempt = 1; $attempt -le 90; $attempt++) {
          try {
            $response = Invoke-WebRequest -Uri $healthUrl -TimeoutSec 5
            if ($response.StatusCode -eq 200) {
              Write-Host "Application is ready: $Env:AZURE_CONTAINER_APP_ENDPOINT"
              exit 0
            }
          } catch {}
          Start-Sleep -Seconds 2
        }
        throw "Application did not become ready at $healthUrl"
    posix:
      shell: sh
      run: |
        health_url="$AZURE_CONTAINER_APP_ENDPOINT/healthz"
        echo "Waiting for the application to become ready..."
        attempt=1
        while [ "$attempt" -le 90 ]; do
          if curl --fail --silent --show-error --max-time 5 "$health_url" > /dev/null; then
            echo "Application is ready: $AZURE_CONTAINER_APP_ENDPOINT"
            exit 0
          fi
          attempt=$((attempt + 1))
          sleep 2
        done
        echo "Application did not become ready at $health_url" >&2
        exit 1
